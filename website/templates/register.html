<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kayıt Ol | AgriBrain</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">

    <style>
        body{
            margin:0;
            font-family:Arial, Helvetica, sans-serif;
            background:#0f5132;
            display:flex;
            justify-content:center;
            align-items:center;
            height:100vh;
        }

        .register-card{
            width:420px;
            background:white;
            border-radius:20px;
            padding:40px;
            box-shadow:0 15px 40px rgba(0,0,0,.25);
            text-align:center;
        }

        .register-card img{
            width:90px;
            margin-bottom:15px;
        }

        h2{
            color:#1d6f42;
            margin-bottom:25px;
        }

        input{
            width:100%;
            padding:14px;
            margin:10px 0;
            border-radius:10px;
            border:1px solid #ccc;
            font-size:16px;
            box-sizing:border-box;
        }

        button{
            width:100%;
            padding:14px;
            border:none;
            border-radius:10px;
            background:#7ed957;
            color:white;
            font-size:17px;
            font-weight:bold;
            cursor:pointer;
            transition:.3s;
        }

        button:hover{
            background:#56b837;
        }

        a{
            color:#1d6f42;
            text-decoration:none;
            font-weight:bold;
        }

        .back{
            margin-top:18px;
        }
    </style>
</head>

<body>

<div class="register-card">

    <a href="/">
        <img src="{{ url_for('static', filename='logo.svg') }}" alt="AgriBrain">
    </a>

    <h2>AgriBrain Kayıt Ol</h2>

    <form action="/register" method="POST">

        <input
            type="text"
            name="name"
            placeholder="Ad Soyad"
            required>

        <input
            type="email"
            name="email"
            placeholder="E-posta"
            required>

        <input
            type="password"
            name="password"
            placeholder="Şifre"
            required>

        <button type="submit">
            Kayıt Ol
        </button>

    </form>

    <div class="back">
        Zaten hesabın var mı?
        <br><br>
        <a href="/login">Giriş Yap</a>
    </div>

</div>

</body>
</html>
